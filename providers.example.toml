[[provider]]
name = "publicnode"
chain = "base"
url = "https://base-rpc.publicnode.com"
min_interval = 1.0

[[provider]]
name = "base-official"
chain = "base"
url = "https://mainnet.base.org"
min_interval = 1.0

[[provider]]
name = "1rpc"
chain = "base"
url = "https://1rpc.io/base"
min_interval = 1.5
